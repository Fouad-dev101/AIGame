<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BLACKSITE — TACTICAL OPS</title>
<style>
  :root {
    --amber: #d7b16a;
    --red: #e0553c;
    --blue: #559ce0;
    --green: #7bd457;
    --bg: #0a0c10;
    --panel: rgba(14, 18, 24, 0.95);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #e0e5eb; }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  .hidden { display: none !important; }

  /* HUD */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  
  #crosshair {
    position: absolute; left: 50%; top: 50%; width: 20px; height: 20px;
    transform: translate(-50%, -50%); transition: transform 0.1s;
  }
  #crosshair i { position: absolute; background: rgba(255, 255, 255, 0.9); box-shadow: 0 0 3px rgba(0,0,0,1); }
  #crosshair .t { left: 50%; top: 0; width: 2px; height: 6px; transform: translateX(-50%); }
  #crosshair .b { left: 50%; bottom: 0; width: 2px; height: 6px; transform: translateX(-50%); }
  #crosshair .l { top: 50%; left: 0; width: 6px; height: 2px; transform: translateY(-50%); }
  #crosshair .r { top: 50%; right: 0; width: 6px; height: 2px; transform: translateY(-50%); }
  #crosshair .dot { left: 50%; top: 50%; width: 2px; height: 2px; transform: translate(-50%, -50%); }

  #hitmarker {
    position: absolute; left: 50%; top: 50%; width: 24px; height: 24px;
    transform: translate(-50%, -50%) rotate(45deg); opacity: 0; transition: opacity 0.1s;
  }
  #hitmarker i { position: absolute; background: #fff; }
  #hitmarker .a { left: 50%; top: 0; width: 2px; height: 8px; transform: translateX(-50%); }
  #hitmarker .b { left: 50%; bottom: 0; width: 2px; height: 8px; transform: translateX(-50%); }
  #hitmarker .c { top: 50%; left: 0; height: 2px; width: 8px; transform: translateY(-50%); }
  #hitmarker .d { top: 50%; right: 0; height: 2px; width: 8px; transform: translateY(-50%); }
  #hitmarker.kill i { background: var(--red); }

  #topHUD {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 30px; align-items: center; background: var(--panel);
    padding: 8px 24px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.1);
  }
  .teamScore { font-size: 22px; font-weight: bold; }
  .teamT { color: var(--amber); }
  .teamCT { color: var(--blue); }
  .timer { font-size: 24px; font-family: monospace; color: #fff; letter-spacing: 1px; }

  #bottomHUD {
    position: absolute; bottom: 20px; left: 20px; right: 20px;
    display: flex; justify-content: space-between; align-items: flex-end;
  }
  
  #healthBox { background: var(--panel); padding: 12px 20px; border-radius: 4px; border-left: 3px solid var(--green); display: flex; gap: 20px; align-items: center; }
  #healthBox .val { font-size: 32px; font-weight: bold; color: #fff; width: 60px; }
  #armorBox .val { font-size: 20px; color: #88aadd; }

  #ammoBox { background: var(--panel); padding: 12px 20px; border-radius: 4px; border-right: 3px solid var(--amber); text-align: right; }
  #weaponName { font-size: 12px; color: var(--amber); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 4px; }
  #ammoLine { display: flex; align-items: baseline; justify-content: flex-end; gap: 8px; }
  #magNum { font-size: 36px; font-weight: bold; color: #fff; line-height: 1; }
  #resNum { font-size: 18px; color: #8892a0; }

  #moneyHUD {
    position: absolute; top: 20px; right: 20px; font-size: 28px; font-weight: bold;
    color: var(--green); background: var(--panel); padding: 8px 20px; border-radius: 4px;
  }

  #bombStatus {
    position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
    color: var(--red); font-size: 20px; font-weight: bold; letter-spacing: 2px;
    text-shadow: 0 0 10px rgba(224, 85, 60, 0.5);
  }

  #interactPrompt {
    position: absolute; left: 50%; top: 60%; transform: translateX(-50%);
    background: rgba(0,0,0,0.8); padding: 10px 20px; border: 1px solid var(--amber);
    color: var(--amber); font-size: 14px; font-weight: bold; letter-spacing: 1px;
    opacity: 0; transition: opacity 0.2s; text-align: center;
  }

  #damageOverlay {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(circle, transparent 50%, rgba(200, 20, 0, 0.6) 100%);
    opacity: 0; transition: opacity 0.1s;
  }

  #clickOverlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.6); z-index: 20; cursor: pointer;
  }
  #clickOverlay span {
    background: var(--panel); padding: 20px 40px; border: 1px solid var(--amber);
    color: var(--amber); font-size: 20px; font-weight: bold; letter-spacing: 2px;
    text-transform: uppercase; pointer-events: none;
  }

  /* Screens */
  .screen {
    position: fixed; inset: 0; background: rgba(5, 7, 10, 0.9);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 50; backdrop-filter: blur(5px);
  }
  .panel {
    background: var(--panel); border: 1px solid rgba(255,255,255,0.1);
    padding: 40px; width: 90%; max-width: 800px; border-radius: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .title { font-size: 48px; font-weight: 900; letter-spacing: 4px; margin-bottom: 10px; text-align: center; }
  .title span { color: var(--amber); }
  .subtitle { font-size: 14px; color: #6a7580; letter-spacing: 6px; text-transform: uppercase; text-align: center; margin-bottom: 40px; }
  
  .btn {
    background: rgba(215, 177, 106, 0.1); border: 1px solid var(--amber); color: var(--amber);
    padding: 15px 30px; font-size: 16px; font-weight: bold; letter-spacing: 2px;
    cursor: pointer; transition: all 0.2s; text-transform: uppercase; width: 100%;
    margin-bottom: 10px;
  }
  .btn:hover { background: var(--amber); color: #000; }
  .btn.ghost { border-color: #6a7580; color: #6a7580; background: transparent; }
  .btn.ghost:hover { border-color: #fff; color: #fff; }

  /* Buy Menu */
  #buyMenu .panel { max-width: 1000px; display: flex; flex-direction: column; }
  .buyGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px; }
  .buyItem {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    padding: 20px; cursor: pointer; transition: all 0.2s; text-align: left;
  }
  .buyItem:hover { background: rgba(255,255,255,0.1); border-color: var(--amber); }
  .buyItem.disabled { opacity: 0.5; cursor: not-allowed; border-color: transparent; }
  .buyName { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
  .buyPrice { color: var(--green); font-weight: bold; }
  .buyDesc { font-size: 12px; color: #8892a0; margin-top: 10px; }

  #centerMsg {
    position: absolute; top: 30%; left: 50%; transform: translateX(-50%);
    font-size: 32px; font-weight: 900; letter-spacing: 4px; color: #fff;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8); opacity: 0; transition: opacity 0.3s;
    text-align: center; text-transform: uppercase;
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="clickOverlay" class="hidden"><span>Click to Lock Mouse</span></div>

<div id="hud" class="hidden">
  <div id="crosshair">
    <i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i><i class="dot"></i>
  </div>
  <div id="hitmarker"><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i></div>
  <div id="damageOverlay"></div>
  
  <div id="topHUD">
    <span class="teamScore teamT" id="scoreT">0</span>
    <span class="timer" id="roundTimer">1:55</span>
    <span class="teamScore teamCT" id="scoreCT">0</span>
  </div>

  <div id="moneyHUD">$<span id="moneyVal">800</span></div>
  <div id="bombStatus" class="hidden">BOMB PLANTED</div>

  <div id="interactPrompt">Press <b>E</b> to Plant Bomb</div>
  <div id="centerMsg"></div>

  <div id="bottomHUD">
    <div id="healthBox">
      <div><div style="font-size:10px;color:#8892a0;letter-spacing:1px;">HEALTH</div><div class="val" id="healthVal">100</div></div>
      <div id="armorBox"><div style="font-size:10px;color:#8892a0;letter-spacing:1px;">ARMOR</div><div class="val" id="armorVal">0</div></div>
    </div>
    
    <div id="ammoBox">
      <div id="weaponName">GLOCK-18</div>
      <div id="ammoLine">
        <span id="magNum">20</span>
        <span id="resNum">/ 120</span>
      </div>
    </div>
  </div>
</div>

<div id="mainMenu" class="screen">
  <div class="panel" style="text-align:center;">
    <div class="title">BLACK<span>SITE</span></div>
    <div class="subtitle">Tactical Operations</div>
    <button class="btn" id="btnPlay">Deploy to Site Zero</button>
    <button class="btn ghost" id="btnSettings">Settings</button>
  </div>
</div>

<div id="settingsMenu" class="screen hidden">
  <div class="panel">
    <h2 style="margin-bottom:20px;">Settings</h2>
    <div style="margin-bottom:20px; display:flex; justify-content:space-between; align-items:center;">
      <span>Mouse Sensitivity</span>
      <input type="range" id="setSens" min="0.1" max="3.0" step="0.1" value="1.0">
    </div>
    <div style="margin-bottom:20px; display:flex; justify-content:space-between; align-items:center;">
      <span>Volume</span>
      <input type="range" id="setVol" min="0" max="1" step="0.1" value="0.5">
    </div>
    <button class="btn" id="btnSettingsBack">Back</button>
  </div>
</div>

<div id="buyMenu" class="screen hidden">
  <div class="panel">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <h2>Buy Phase</h2>
      <div style="font-size:24px; color:var(--green); font-weight:bold;">$<span id="buyMoneyVal">800</span></div>
    </div>
    <div class="buyGrid" id="buyGrid"></div>
    <div style="margin-top:30px; display:flex; gap:20px;">
      <button class="btn" id="btnDeploy" style="flex:2; font-size: 20px; background: var(--green); color: #000; border-color: var(--green);">Deploy (Start Round)</button>
      <button class="btn ghost" id="btnCloseBuy" style="flex:1;">Close (B)</button>
    </div>
    <div style="margin-top:15px; text-align:center; color:#8892a0; font-size:12px;">You are completely safe while the buy menu is open.</div>
  </div>
</div>

<div id="deathScreen" class="screen hidden">
  <div class="panel" style="text-align:center; border-color:var(--red);">
    <h1 style="color:var(--red); font-size:48px; margin-bottom:20px;">ELIMINATED</h1>
    <button class="btn" id="btnRespawn">Respawn</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   UTILS & CORE
   ============================================================ */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const $ = id => document.getElementById(id);

// Settings
let settings = { sensitivity: 1.0, volume: 0.5 };
try {
  const s = JSON.parse(localStorage.getItem('blacksite_settings'));
  if(s) Object.assign(settings, s);
} catch(e) {}

// Audio Context
let actx = null;
function initAudio() {
  if(actx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(AC) actx = new AC();
}
function playSound(type, dist = 0) {
  if(!actx || actx.state === 'suspended') return;
  const vol = settings.volume * clamp(1 - dist/50, 0.1, 1);
  if(vol <= 0.01) return;
  
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  osc.connect(gain);
  gain.connect(actx.destination);
  
  const now = actx.currentTime;
  
  if(type === 'rifle') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(150, now);
    osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
    gain.gain.setValueAtTime(vol * 0.6, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
    osc.start(now); osc.stop(now + 0.15);
  } else if(type === 'pistol') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(250, now);
    osc.frequency.exponentialRampToValueAtTime(50, now + 0.08);
    gain.gain.setValueAtTime(vol * 0.4, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
    osc.start(now); osc.stop(now + 0.1);
  } else if(type === 'hit') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(800, now);
    gain.gain.setValueAtTime(vol * 0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
    osc.start(now); osc.stop(now + 0.05);
  } else if(type === 'empty') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(400, now);
    gain.gain.setValueAtTime(vol * 0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
    osc.start(now); osc.stop(now + 0.05);
  }
}

/* ============================================================
   RENDERER & SCENE
   ============================================================ */
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.autoClear = false; 

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87a8c9); 
scene.fog = new THREE.Fog(0x87a8c9, 30, 150);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.05, 500);
camera.rotation.order = 'YXZ';

const weaponScene = new THREE.Scene();
const weaponCamera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 10);

/* ---- LIGHTING ---- */
const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 2.5); 
scene.add(hemiLight);

const sunLight = new THREE.DirectionalLight(0xffeedd, 3.0);
sunLight.position.set(50, 80, 30);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 2048;
sunLight.shadow.mapSize.height = 2048;
sunLight.shadow.camera.near = 1;
sunLight.shadow.camera.far = 200;
sunLight.shadow.camera.left = -60;
sunLight.shadow.camera.right = 60;
sunLight.shadow.camera.top = 60;
sunLight.shadow.camera.bottom = -60;
sunLight.shadow.bias = -0.001;
scene.add(sunLight);

// Weapon lighting
weaponScene.add(new THREE.AmbientLight(0xffffff, 1.5));
const wDir = new THREE.DirectionalLight(0xffffff, 2.5);
wDir.position.set(-1, 2, 1);
weaponScene.add(wDir);
const wFill = new THREE.DirectionalLight(0x8899cc, 1.5);
wFill.position.set(2, -1, 1);
weaponScene.add(wFill);

/* ============================================================
   MATERIALS
   ============================================================ */
function createNoiseTex(size, base, variance) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(size, size);
  for(let i=0; i<size*size; i++) {
    const v = clamp(base + (Math.random()-0.5)*variance, 0, 255);
    img.data[i*4] = v; img.data[i*4+1] = v; img.data[i*4+2] = v; img.data[i*4+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

const texConcrete = createNoiseTex(256, 180, 40);
texConcrete.repeat.set(4, 4);
const texMetal = createNoiseTex(256, 150, 60);
texMetal.repeat.set(2, 2);

const MAT = {
  concrete: new THREE.MeshStandardMaterial({ color: 0x9a9a9a, map: texConcrete, roughness: 0.9, metalness: 0.1 }),
  concreteDark: new THREE.MeshStandardMaterial({ color: 0x666666, map: texConcrete, roughness: 0.9, metalness: 0.1 }),
  metal: new THREE.MeshStandardMaterial({ color: 0x8899aa, map: texMetal, roughness: 0.4, metalness: 0.8 }),
  wood: new THREE.MeshStandardMaterial({ color: 0x7b5c4a, roughness: 0.8, metalness: 0.0 }),
  red: new THREE.MeshStandardMaterial({ color: 0xaa3333, roughness: 0.5, metalness: 0.2 }),
  gunMetal: new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.4, metalness: 0.9 }),
  gunPoly: new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.7, metalness: 0.1 }),
  skin: new THREE.MeshStandardMaterial({ color: 0xd5b09a, roughness: 0.8 }),
  armor: new THREE.MeshStandardMaterial({ color: 0x4a5540, roughness: 0.7, metalness: 0.2 }),
};

/* ============================================================
   MAP (SITE ZERO) - UPGRADED 3D ENVIRONMENT
   ============================================================ */
const world = new THREE.Group();
scene.add(world);
const colliders = [];
const losMeshes = [];

function addBox(x, y, z, w, h, d, mat, collide = true) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  world.add(mesh);
  losMeshes.push(mesh);
  if(collide) {
    colliders.push({ minX: x-w/2, maxX: x+w/2, minZ: z-d/2, maxZ: z+d/2 });
  }
  return mesh;
}

function addFloor(x, z, w, d, mat) {
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat);
  mesh.rotation.x = -Math.PI/2;
  mesh.position.set(x, 0, z);
  mesh.receiveShadow = true;
  world.add(mesh);
  losMeshes.push(mesh);
  return mesh;
}

function buildStairs(x, y, z, width, steps, stepH, stepD, mat) {
  for(let i=0; i<steps; i++) {
    addBox(x, y + i*stepH + stepH/2, z + i*stepD, width, stepH, stepD, mat);
  }
}

function buildMap() {
  addFloor(0, 0, 100, 100, MAT.concrete);
  
  // Perimeter Walls
  addBox(0, 5, -40, 80, 10, 1, MAT.concreteDark); 
  addBox(0, 5, 40, 80, 10, 1, MAT.concreteDark);  
  addBox(-40, 5, 0, 1, 10, 80, MAT.concreteDark); 
  addBox(40, 5, 0, 1, 10, 80, MAT.concreteDark);  

  // --- SPAWN T (South) ---
  addBox(0, 2.5, 37, 24, 5, 1, MAT.concrete); 
  addBox(-15, 2, 30, 2, 4, 10, MAT.concrete); 
  
  // --- SPAWN CT (North) ---
  addBox(0, 2.5, -37, 24, 5, 1, MAT.concrete);
  addBox(15, 2, -30, 2, 4, 10, MAT.concrete);

  // --- BOMB SITE A (East) - Elevated Platform & Stairs ---
  addBox(25, 1, 0, 20, 2, 20, MAT.concreteDark); // Raised platform
  buildStairs(15, 0, -8, 6, 5, 0.4, 0.8, MAT.concrete); // Stairs up
  addBox(20, 2.5, 5, 2, 2, 2, MAT.wood); // Cover on platform
  addBox(28, 3, -2, 2, 2, 2, MAT.wood);
  addBox(30, 2.5, 8, 2, 2, 2, MAT.wood);
  // Site A Marker
  const siteA = new THREE.Mesh(new THREE.CylinderGeometry(4, 4, 0.2, 32), new THREE.MeshBasicMaterial({color: 0xff3333, transparent: true, opacity: 0.6}));
  siteA.position.set(25, 2.05, 0);
  world.add(siteA);

  // --- BOMB SITE B (West) - Two-Story Warehouse ---
  // Ground floor
  addBox(-25, 4, -10, 20, 8, 1, MAT.concreteDark); 
  addBox(-35, 4, 0, 1, 8, 20, MAT.concreteDark); 
  addBox(-15, 4, 0, 1, 8, 20, MAT.concreteDark); 
  addBox(-25, 4, 10, 6, 8, 1, MAT.concreteDark); 
  addBox(-31, 4, 10, 8, 8, 1, MAT.concreteDark);
  addBox(-19, 4, 10, 8, 8, 1, MAT.concreteDark);
  // Second floor / Catwalk
  addBox(-25, 4, 0, 18, 1, 18, MAT.concrete); 
  // Stairs inside
  buildStairs(-22, 0, -5, 4, 10, 0.4, 0.6, MAT.metal);
  
  // Cover inside
  addBox(-22, 1, 5, 2, 2, 2, MAT.wood);
  addBox(-28, 1, 5, 2, 2, 2, MAT.wood);
  addBox(-25, 5, 2, 2, 2, 2, MAT.wood); // On catwalk
  
  const siteB = new THREE.Mesh(new THREE.CylinderGeometry(3.5, 3.5, 0.2, 32), new THREE.MeshBasicMaterial({color: 0xff3333, transparent: true, opacity: 0.6}));
  siteB.position.set(-25, 0.05, 0);
  world.add(siteB);

  // --- MID (Center) - Bridge over a trench ---
  addBox(0, 2, 0, 10, 4, 20, MAT.concrete); // Mid structure
  // Bridge
  addBox(0, 4, 0, 6, 0.5, 20, MAT.metal); 
  // Trench walls
  addBox(-5, 1, 0, 1, 2, 20, MAT.concreteDark);
  addBox(5, 1, 0, 1, 2, 20, MAT.concreteDark);
  // Side routes
  addBox(-15, 1.5, 15, 10, 3, 2, MAT.concrete); 
  addBox(15, 1.5, 15, 10, 3, 2, MAT.concrete);  
  addBox(-15, 1.5, -15, 10, 3, 2, MAT.concrete);
  addBox(15, 1.5, -15, 10, 3, 2, MAT.concrete);

  // Scattered cover
  for(let i=0; i<15; i++) {
    const x = rnd(-30, 30);
    const z = rnd(-20, 20);
    if(Math.abs(x) < 8 && Math.abs(z) < 12) continue; // Keep mid clear
    if(x > 15 && z > -10 && z < 10) continue;
    if(x < -15 && z > -10 && z < 10) continue;
    addBox(x, 0.75, z, 1.5, 1.5, 1.5, Math.random() > 0.5 ? MAT.wood : MAT.metal);
  }
}

/* ============================================================
   WEAPONS & 3D MODELS
   ============================================================ */

function buildWeaponModel(type) {
  const g = new THREE.Group();
  const metal = MAT.gunMetal;
  const poly = MAT.gunPoly;

  if(type === 'm4') {
    const lower = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.08, 0.2), poly);
    const upper = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.06, 0.25), metal);
    upper.position.set(0, 0.07, -0.02);
    const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, 0.3, 8), metal);
    barrel.rotation.x = Math.PI/2; barrel.position.set(0, 0.06, -0.35);
    const guard = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.25, 8), poly);
    guard.rotation.x = Math.PI/2; guard.position.set(0, 0.04, -0.2);
    const stock = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.05, 0.15), poly);
    stock.position.set(0, 0.02, 0.2);
    const mag = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.15, 0.06), metal);
    mag.position.set(0, -0.1, -0.02); mag.rotation.x = 0.2;
    const grip = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.1, 0.04), poly);
    grip.position.set(0, -0.07, 0.1); grip.rotation.x = -0.3;
    const sight = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.03, 0.06), metal);
    sight.position.set(0, 0.11, 0);
    const redDot = new THREE.Mesh(new THREE.CircleGeometry(0.008, 8), new THREE.MeshBasicMaterial({color: 0xff0000}));
    redDot.position.set(0, 0.11, -0.031);

    g.add(lower, upper, barrel, guard, stock, mag, grip, sight, redDot);
  } else if(type === 'ak') {
    const rec = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.08, 0.25), metal);
    const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.35, 8), metal);
    bar.rotation.x = Math.PI/2; bar.position.set(0, 0.04, -0.3);
    const wood = MAT.wood;
    const stock = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.06, 0.2), wood);
    stock.position.set(0, 0, 0.2); stock.rotation.x = 0.1;
    const hg = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.04, 0.2), wood);
    hg.position.set(0, 0.04, -0.2);
    const mag = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.15, 0.06), metal);
    mag.position.set(0, -0.1, -0.02); mag.rotation.x = 0.4;
    const grip = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.1, 0.04), wood);
    grip.position.set(0, -0.07, 0.08); grip.rotation.x = -0.3;

    g.add(rec, bar, stock, hg, mag, grip);
  } else if(type === 'glock' || type === 'deagle') {
    const slide = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.045, 0.18), metal);
    slide.position.set(0, 0.03, -0.05);
    const frame = new THREE.Mesh(new THREE.BoxGeometry(0.025, 0.025, 0.15), poly);
    frame.position.set(0, 0, -0.05);
    const grip = new THREE.Mesh(new THREE.BoxGeometry(0.025, 0.1, 0.05), poly);
    grip.position.set(0, -0.06, 0.03); grip.rotation.x = -0.2;
    const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.05, 8), metal);
    barrel.rotation.x = Math.PI/2; barrel.position.set(0, 0.03, -0.15);

    g.add(slide, frame, grip, barrel);
    if(type === 'deagle') g.scale.set(1.3, 1.3, 1.3);
  }

  // Add 3D Hands (Arms)
  const armMat = MAT.skin;
  
  // Left hand (support)
  const lArm = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.04, 0.3, 8), armMat);
  lArm.position.set(-0.02, -0.1, -0.15); lArm.rotation.x = Math.PI/2; lArm.rotation.z = 0.2;
  const lHand = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.04, 0.08), armMat);
  lHand.position.set(-0.02, -0.04, -0.15);
  
  // Right hand (trigger)
  const rArm = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.04, 0.3, 8), armMat);
  rArm.position.set(0.02, -0.15, 0.15); rArm.rotation.x = Math.PI/2; rArm.rotation.z = -0.2;
  const rHand = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.06, 0.08), armMat);
  rHand.position.set(0.01, -0.07, 0.06);

  g.add(lArm, lHand, rArm, rHand);
  
  g.traverse(o => { if(o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  return g;
}

class Enemy {
  constructor(x, z) {
    this.pos = new THREE.Vector3(x, 0, z);
    this.spawnPos = this.pos.clone();
    this.mesh = buildCharacterModel('T');
    scene.add(this.mesh);
    
    // 3D Health Bar (Sprite)
    const canvas = document.createElement('canvas');
    canvas.width = 128; canvas.height = 16;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ff0000';
    ctx.fillRect(0,0,128,16);
    const tex = new THREE.CanvasTexture(canvas);
    const hbMat = new THREE.SpriteMaterial({map: tex, depthTest: false});
    this.healthBar = new THREE.Sprite(hbMat);
    this.healthBar.scale.set(1, 0.12, 1);
    this.healthBar.position.y = 2.1;
    this.mesh.add(this.healthBar);

    this.health = 5000000;
    this.alive = true;
    this.state = 'patrol';
    this.fireTimer = rnd(1, 3);
    this.patrolTarget = new THREE.Vector3(x + rnd(-10, 10), 0, z + rnd(-10, 10));
    this.walkTime = rnd(0, 10);
  }
  
  reset() {
    this.pos.copy(this.spawnPos);
    this.health = 5000000;
    this.alive = true;
    this.state = 'patrol';
    this.mesh.visible = true;
    this.mesh.position.copy(this.pos);
    this.fireTimer = rnd(1, 3);
    this.healthBar.scale.set(1, 0.12, 1);
  }

  update(dt) {
    if(!this.alive || gameState === 'BUY') return;
    
    const dist = this.pos.distanceTo(player.pos);
    if(dist > 80) {
      this.mesh.visible = false;
      return;
    }
    this.mesh.visible = true;

    const eyePos = new THREE.Vector3(this.pos.x, 1.6, this.pos.z);
    const targetPos = new THREE.Vector3(player.pos.x, player.pos.y + 1.2, player.pos.z);
    const dir = targetPos.clone().sub(eyePos).normalize();
    const ray = new THREE.Raycaster(eyePos, dir, 0, dist);
    const hits = ray.intersectObjects(losMeshes);
    const canSeePlayer = hits.length === 0 && dist < 50;

    if(canSeePlayer && player.alive) {
      this.state = 'engage';
    } else if(this.state === 'engage') {
      this.state = 'search';
    }

    if(this.state === 'engage') {
      const dx = player.pos.x - this.pos.x;
      const dz = player.pos.z - this.pos.z;
      this.mesh.rotation.y = Math.atan2(dx, dz);

      this.fireTimer -= dt;
      if(this.fireTimer <= 0 && player.invulnerable <= 0) {
        playSound('rifle', dist);
        this.fireTimer = rnd(0.1, 0.2); 
        
        const hitChance = clamp(1 - dist/50, 0.2, 0.85);
        if(Math.random() < hitChance) {
          damagePlayer(rnd(10, 20));
        }
        // 3D Tracer from enemy gun
        const gunPos = new THREE.Vector3(this.pos.x, 1.25, this.pos.z).add(dir.clone().multiplyScalar(0.5));
        spawnTracer(gunPos, targetPos);
      }
      
      // Simple strafe
      this.pos.x += Math.sin(performance.now()*0.002) * 2 * dt;
      this.pos.z += Math.cos(performance.now()*0.002) * 2 * dt;

    } else if(this.state === 'patrol') {
      const d = this.pos.distanceTo(this.patrolTarget);
      if(d < 1) {
        this.patrolTarget.set(rnd(-30, 30), 0, rnd(-20, 20));
      } else {
        const dir = this.patrolTarget.clone().sub(this.pos).normalize();
        this.pos.addScaledVector(dir, 2 * dt);
        this.mesh.rotation.y = Math.atan2(dir.x, dir.z);
      }
    }

    this.walkTime += dt * (this.state === 'engage' ? 5 : 2);
    const bob = Math.sin(this.walkTime) * 0.05;
    
    this.mesh.position.set(this.pos.x, bob, this.pos.z);
    
    // Enemy Collision
    for(const c of colliders) {
      const cx = clamp(this.pos.x, c.minX, c.maxX);
      const cz = clamp(this.pos.z, c.minZ, c.maxZ);
      const dx = this.pos.x - cx, dz = this.pos.z - cz;
      const d2 = dx*dx + dz*dz;
      if(d2 < 0.16) {
        const d = Math.sqrt(d2) || 0.01;
        this.pos.x += (dx / d) * (0.4 - d);
        this.pos.z += (dz / d) * (0.4 - d);
      }
    }
  }

  takeDamage(dmg) {
    this.health -= dmg;
    this.healthBar.scale.x = Math.max(0, this.health / 100);
    
    // Flash health bar
    this.healthBar.material.color.setHex(0xffffff);
    setTimeout(() => { this.healthBar.material.color.setHex(0xff0000); }, 100);
    
    if(this.health <= 0) {
      this.alive = false;
      this.mesh.visible = false;
    }
  }
}

/* ============================================================
   EFFECTS
   ============================================================ */
const tracers = [];
function spawnTracer(from, to) {
  const geo = new THREE.BufferGeometry().setFromPoints([from, to]);
  const mat = new THREE.LineBasicMaterial({ color: 0xffdd88, transparent: true, opacity: 1 });
  const line = new THREE.Line(geo, mat);
  scene.add(line);
  tracers.push({ mesh: line, life: 0.1 });
}
function updateEffects(dt) {
  for(let i=tracers.length-1; i>=0; i--) {
    tracers[i].life -= dt;
    tracers[i].mesh.material.opacity = tracers[i].life / 0.1;
    if(tracers[i].life <= 0) {
      scene.remove(tracers[i].mesh);
      tracers[i].mesh.geometry.dispose();
      tracers[i].mesh.material.dispose();
      tracers.splice(i, 1);
    }
  }
}

let gameState = 'MENU'; 
let roundTime = 115;
let scoreT = 0;
let scoreCT = 0;
let bombPlanted = false;
let bombTimer = 40;

function startRound() {
  player.pos.set(0, 0, 30); 
  player.vel.set(0, 0, 0);
  player.yaw = 0; 
  player.health = 5000000;
  player.alive = true;
  player.invulnerable = 5.0; 
  player.money = Math.min(16000, player.money + 1400); 
  
  enemies.forEach(e => e.reset());

  roundTime = 115;
  bombPlanted = false;
  gameState = 'BUY';
  
  $('hud').classList.remove('hidden');
  $('buyMenu').classList.remove('hidden');
  $('deathScreen').classList.add('hidden');
  $('clickOverlay').classList.add('hidden');
  
  updateMoneyUI();
  populateBuyMenu();
}

function update(dt) {
  if(gameState === 'PLAYING') {
    if(roundTime > 0) roundTime -= dt;
    
    if(bombPlanted) {
      bombTimer -= dt;
      $('roundTimer').textContent = `0:${Math.floor(bombTimer).toString().padStart(2, '0')}`;
      if(bombTimer <= 0) endRound('T');
    } else {
      const m = Math.floor(roundTime / 60);
      const s = Math.floor(roundTime % 60);
      $('roundTimer').textContent = `${m}:${s.toString().padStart(2, '0')}`;
      if(roundTime <= 0) endRound('CT');
    }

    if(player.invulnerable > 0) player.invulnerable -= dt;

    updatePlayer(dt);
    enemies.forEach(e => e.update(dt));
    updateEffects(dt);
    checkObjectives();
  }
}

function updatePlayer(dt) {
  if(!player.alive) return;

  let ix = 0, iz = 0;
  if(keys['KeyW']) iz -= 1;
  if(keys['KeyS']) iz += 1;
  if(keys['KeyA']) ix -= 1;
  if(keys['KeyD']) ix += 1;
  
  const len = Math.hypot(ix, iz);
  if(len > 0) { ix /= len; iz /= len; }

  let speed = 5.0;
  if(keys['ShiftLeft']) speed = 3.0; 
  if(player.adsT > 0.5) speed = 2.5;
  
  const sin = Math.sin(player.yaw), cos = Math.cos(player.yaw);
  const wx = ix * cos + iz * sin;
  const wz = -ix * sin + iz * cos;
  
  player.vel.x = lerp(player.vel.x, wx * speed, 10 * dt);
  player.vel.z = lerp(player.vel.z, wz * speed, 10 * dt);
  
  player.pos.x += player.vel.x * dt;
  player.pos.z += player.vel.z * dt;
  
  for(const c of colliders) {
    const cx = clamp(player.pos.x, c.minX, c.maxX);
    const cz = clamp(player.pos.z, c.minZ, c.maxZ);
    const dx = player.pos.x - cx, dz = player.pos.z - cz;
    const d2 = dx*dx + dz*dz;
    if(d2 < player.radius*player.radius) {
      let d = Math.sqrt(d2);
      if(d < 0.01) {
        player.pos.x += rnd(-0.1, 0.1);
        player.pos.z += rnd(-0.1, 0.1);
      } else {
        player.pos.x += (dx / d) * (player.radius - d);
        player.pos.z += (dz / d) * (player.radius - d);
      }
    }
  }

  player.vy -= 20 * dt;
  player.pos.y += player.vy * dt;
  if(player.pos.y <= 0) {
    player.pos.y = 0;
    player.vy = 0;
    player.onGround = true;
  }
  if(keys['Space'] && player.onGround) {
    player.vy = 6.5;
    player.onGround = false;
  }

  const targetFov = lerp(75, WEAPONS[player.weapon].adsFov, player.adsT);
  camera.fov = lerp(camera.fov, targetFov, 10 * dt);
  camera.updateProjectionMatrix();

  camera.position.set(player.pos.x, player.pos.y + player.height, player.pos.z);
  camera.rotation.y = player.yaw;
  camera.rotation.x = player.pitch + player.recoilPitch;
  
  player.recoilPitch = lerp(player.recoilPitch, 0, 8 * dt);

  if(mouseDown && player.fireTimer <= 0 && !player.reloading) {
    fireWeapon();
  }
  if(player.fireTimer > 0) player.fireTimer -= dt;

  if(player.reloading) {
    player.reloadTimer -= dt;
    if(player.reloadTimer <= 0) finishReload();
  }

  const wantAds = adsHeld && !player.reloading;
  player.adsT = lerp(player.adsT, wantAds ? 1 : 0, 15 * dt);

  const atSite = checkBombSite();
  if(atSite && !bombPlanted && keys['KeyE']) {
    bombPlanted = true;
    bombTimer = 40;
    $('bombStatus').classList.remove('hidden');
    showCenterMsg('BOMB PLANTED');
    playSound('hit');
    updateHUD();
  }
}

function fireWeapon() {
  const w = WEAPONS[player.weapon];
  if(player.ammo[player.weapon] <= 0) {
    playSound('empty');
    player.fireTimer = 0.2;
    return;
  }

  player.ammo[player.weapon]--;
  player.fireTimer = 60 / w.rpm;
  playSound(w.type === 'rifle' ? 'rifle' : 'pistol');
  
  player.recoilPitch += w.recoilKick;
  player.recoilPitch += rnd(-w.recoilRand, w.recoilRand);

  const spread = player.adsT > 0.5 ? w.spreadAds : w.spreadHip;
  const dir = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
  dir.x += rnd(-spread, spread);
  dir.y += rnd(-spread, spread);
  
  const ray = new THREE.Raycaster(camera.position, dir, 0, 150);
  const targets = losMeshes.slice();
  enemies.forEach(e => { if(e.alive) targets.push(e.mesh); });
  
  const hits = ray.intersectObjects(targets, true);
  
  if(hits.length > 0) {
    const hit = hits[0];
    let enemyObj = null;
    let curr = hit.object;
    while(curr) {
      if(curr.userData.isEnemy) { enemyObj = curr; break; }
      curr = curr.parent;
    }

    if(enemyObj) {
      const enemy = enemies.find(e => e.mesh === enemyObj || e.mesh.children.includes(enemyObj));
      if(enemy && enemy.alive) {
        const isHead = hit.object.userData.part === 'head';
        let dmg = w.damage * (isHead ? w.headMul : 1);
        enemy.takeDamage(dmg);
        
        showHitMarker(isHead);
        playSound('hit');
        
        if(!enemy.alive) {
          player.money += 300;
          updateMoneyUI();
        }
      }
    }
    spawnTracer(camera.position.clone().add(dir.clone().multiplyScalar(0.5)), hit.point);
  } else {
    spawnTracer(camera.position.clone().add(dir.clone().multiplyScalar(0.5)), camera.position.clone().add(dir.multiplyScalar(100)));
  }

  // 3D Muzzle Flash
  muzzleFlash.position.copy(weaponRoot.position).add(new THREE.Vector3(0, 0.05, -0.8));
  muzzleFlash.material.opacity = 1;
  muzzleFlash.visible = true;
  
  muzzleLight.position.copy(muzzleFlash.position);
  muzzleLight.intensity = 2;
  
  setTimeout(() => { 
    muzzleFlash.visible = false; 
    muzzleLight.intensity = 0;
  }, 40);
  
  updateHUD();
}

function reload() {
  const w = WEAPONS[player.weapon];
  if(player.reloading || player.ammo[player.weapon] === w.magSize || player.reserve[player.weapon] <= 0) return;
  
  player.reloading = true;
  player.reloadTimer = w.reloadTime;
  playSound('hit'); 
}

function finishReload() {
  const w = WEAPONS[player.weapon];
  const need = w.magSize - player.ammo[player.weapon];
  const take = Math.min(need, player.reserve[player.weapon]);
  player.ammo[player.weapon] += take;
  player.reserve[player.weapon] -= take;
  player.reloading = false;
  updateHUD();
}

function switchWeapon(w) {
  if(player.weapon === w || player.reloading) return;
  player.weapon = w;
  player.reloading = false;
  
  weaponRoot.clear();
  weaponRoot.add(buildWeaponModel(w));
  
  updateHUD();
}

/* ============================================================
   HELPERS & UI
   ============================================================ */
function damagePlayer(dmg) {
  if(player.invulnerable > 0 || !player.alive || gameState === 'BUY') return;
  
  player.health -= dmg;
  $('damageOverlay').style.opacity = '1';
  setTimeout(() => { $('damageOverlay').style.opacity = '0'; }, 100);
  
  if(player.health <= 0) {
    player.health = 0;
    player.alive = false;
    gameState = 'DEAD';
    $('deathScreen').classList.remove('hidden');
    document.exitPointerLock();
  }
  updateHUD();
}

function checkBombSite() {
  const distA = Math.hypot(player.pos.x - 25, player.pos.z - 0);
  const distB = Math.hypot(player.pos.x - (-25), player.pos.z - 0);
  if(distA < 6) return 'A';
  if(distB < 6) return 'B';
  return null;
}

function checkObjectives() {
  const atSite = checkBombSite();
  const prompt = $('interactPrompt');
  if(atSite && !bombPlanted) {
    prompt.style.opacity = '1';
    prompt.innerHTML = `Press <b>E</b> to Plant Bomb at Site ${atSite}`;
  } else {
    prompt.style.opacity = '0';
  }

  if(enemies.every(e => !e.alive) && gameState === 'PLAYING') {
    endRound('CT');
  }
}

function endRound(winner) {
  gameState = 'BUY';
  if(winner === 'T') {
    scoreT++;
    $('scoreT').textContent = scoreT;
    showCenterMsg('TERRORISTS WIN');
  } else {
    scoreCT++;
    $('scoreCT').textContent = scoreCT;
    showCenterMsg('COUNTER-TERRORISTS WIN');
  }
  
  setTimeout(() => {
    startRound();
  }, 4000);
}

function showCenterMsg(text) {
  const el = $('centerMsg');
  el.textContent = text;
  el.style.opacity = '1';
  setTimeout(() => { el.style.opacity = '0'; }, 3000);
}

function showHitMarker(head) {
  const el = $('hitmarker');
  el.style.opacity = '1';
  if(head) el.style.filter = 'hue-rotate(120deg)';
  else el.style.filter = 'none';
  setTimeout(() => { el.style.opacity = '0'; }, 100);
}

function updateHUD() {
  $('healthVal').textContent = Math.ceil(player.health);
  $('armorVal').textContent = player.armor;
  $('weaponName').textContent = WEAPONS[player.weapon].name;
  $('magNum').textContent = player.ammo[player.weapon];
  $('resNum').textContent = `/ ${player.reserve[player.weapon]}`;
}

function updateMoneyUI() {
  $('moneyVal').textContent = player.money;
}

/* ============================================================
   BUY MENU
   ============================================================ */
function populateBuyMenu() {
  $('buyMoneyVal').textContent = player.money;
  const grid = $('buyGrid');
  grid.innerHTML = '';
  
  const items = [
    { id: 'm4', type: 'Primary' },
    { id: 'ak', type: 'Primary' },
    { id: 'deagle', type: 'Secondary' },
    { id: 'glock', type: 'Secondary' },
    { id: 'armor', type: 'Equipment' }
  ];

  items.forEach(item => {
    let name, price, desc;
    if(item.id === 'armor') {
      name = 'Kevlar Vest';
      price = 650;
      desc = '100 Armor points';
    } else {
      const w = WEAPONS[item.id];
      name = w.name;
      price = w.price;
      desc = `Damage: ${w.damage} | Mag: ${w.magSize}`;
    }

    const el = document.createElement('div');
    el.className = 'buyItem';
    if(player.money < price) el.classList.add('disabled');
    
    el.innerHTML = `
      <div class="buyName">${name}</div>
      <div class="buyPrice">$${price}</div>
      <div class="buyDesc">${desc}</div>
    `;

    if(player.money >= price) {
      el.onclick = () => {
        player.money -= price;
        updateMoneyUI();
        $('buyMoneyVal').textContent = player.money;
        
        if(item.id === 'armor') {
          player.armor = 100;
        } else {
          player.ammo[item.id] = WEAPONS[item.id].magSize;
          player.reserve[item.id] = WEAPONS[item.id].reserveMax;
          switchWeapon(item.id);
        }
        
        populateBuyMenu();
      };
    }
    grid.appendChild(el);
  });
}

/* ============================================================
   CONTROLS
   ============================================================ */
document.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  
  if(e.code === 'KeyB' && (gameState === 'BUY' || gameState === 'PLAYING')) {
    if($('buyMenu').classList.contains('hidden')) {
      $('buyMenu').classList.remove('hidden');
      document.exitPointerLock();
    } else {
      $('buyMenu').classList.add('hidden');
      gameState = 'PLAYING';
      canvas.requestPointerLock();
    }
  }
  
  if(e.code === 'KeyR') reload();
  if(e.code === 'Digit1') switchWeapon('m4');
  if(e.code === 'Digit2') switchWeapon('ak');
  if(e.code === 'Digit3') switchWeapon('deagle');
  if(e.code === 'Digit4') switchWeapon('glock');
});

document.addEventListener('keyup', (e) => {
  keys[e.code] = false;
});

canvas.addEventListener('mousedown', (e) => {
  if(gameState === 'PLAYING' && pointerLocked) {
    if(e.button === 0) mouseDown = true;
    if(e.button === 2) adsHeld = true;
  }
});

canvas.addEventListener('mouseup', (e) => {
  if(e.button === 0) mouseDown = false;
  if(e.button === 2) adsHeld = false;
});

canvas.addEventListener('contextmenu', e => e.preventDefault());

document.addEventListener('mousemove', (e) => {
  if(!pointerLocked || gameState !== 'PLAYING') return;
  const sens = 0.002 * settings.sensitivity;
  player.yaw -= e.movementX * sens;
  player.pitch -= e.movementY * sens;
  player.pitch = clamp(player.pitch, -Math.PI/2 + 0.1, Math.PI/2 - 0.1);
});

document.addEventListener('pointerlockchange', () => {
  pointerLocked = document.pointerLockElement === canvas;
  if(gameState === 'PLAYING' && !pointerLocked) {
    $('clickOverlay').classList.remove('hidden');
  } else {
    $('clickOverlay').classList.add('hidden');
  }
});

$('clickOverlay').onclick = () => {
  if(gameState === 'PLAYING') canvas.requestPointerLock();
};

/* ============================================================
   INIT
   ============================================================ */
function init() {
  buildMap();
  
  enemies.push(new Enemy(25, 5)); 
  enemies.push(new Enemy(-25, 0)); 
  enemies.push(new Enemy(0, 0)); 
  
  weaponRoot.add(buildWeaponModel('glock'));
  weaponRoot.position.set(0.25, -0.2, -0.5);

  // UI Bindings
  $('btnPlay').onclick = () => {
    initAudio();
    $('mainMenu').classList.add('hidden');
    startRound();
  };
  
  $('btnDeploy').onclick = () => {
    $('buyMenu').classList.add('hidden');
    gameState = 'PLAYING';
    canvas.requestPointerLock();
  };

  $('btnCloseBuy').onclick = () => {
    if(gameState === 'BUY') {
      $('buyMenu').classList.add('hidden');
      gameState = 'PLAYING';
      canvas.requestPointerLock();
    }
  };

  $('btnRespawn').onclick = () => {
    startRound();
  };
  $('btnSettings').onclick = () => {
    $('mainMenu').classList.add('hidden');
    $('settingsMenu').classList.remove('hidden');
  };
  $('btnSettingsBack').onclick = () => {
    $('settingsMenu').classList.add('hidden');
    $('mainMenu').classList.remove('hidden');
  };
  $('setSens').oninput = (e) => {
    settings.sensitivity = parseFloat(e.target.value);
    localStorage.setItem('blacksite_settings', JSON.stringify(settings));
  };
  $('setVol').oninput = (e) => {
    settings.volume = parseFloat(e.target.value);
    localStorage.setItem('blacksite_settings', JSON.stringify(settings));
  };
  
  $('setSens').value = settings.sensitivity;
  $('setVol').value = settings.volume;

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    weaponCamera.aspect = window.innerWidth / window.innerHeight;
    weaponCamera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  let lastTime = performance.now();
  function animate() {
    requestAnimationFrame(animate);
    const now = performance.now();
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    dt = Math.min(dt, 0.1);

    update(dt);

    // Render Pipeline
    renderer.clear();
    renderer.render(scene, camera); // Render World
    
    if(gameState === 'PLAYING' || gameState === 'DEAD') {
      renderer.clearDepth();
      renderer.render(weaponScene, weaponCamera); // Render Weapon Overlay
    }
  }
  animate();
}

init();
</script>
</body>

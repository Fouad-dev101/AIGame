function setS(s){mo.state=s;mo.rp=0}
function ai(dt){const dx=px-mo.x,dz=pz-mo.z,d=Math.hypot(dx,dz)||.01,los=LOS(mo.x,mo.z,px,pz),k=powered?1.3:1;
if(mo.frozen>0){mo.frozen-=dt;mo.fa=Math.atan2(dx,dz);if(mo.frozen<=0&&mo.vanish){const[x,z]=pick(24,80,px,pz);mo.x=x;mo.z=z;mo.path=[]}}
const fwd=(Math.sin(mo.fa)*dx+Math.cos(mo.fa)*dz)/d>.1,rng=flashOn?17:11;

function power(){powered=true;amb.color.set(0x4a3a30);lamps.forEach(l=>{if(l.l){l.l.color.set(0xff5a3a);l.l.intensity=1.3}});exitDoor.userData.open=1;S(()=>{sting()});upd()}

// ---- audio
function initAudio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=vol;MG.connect(AC.destination);
const mk=b=>{const bf=AC.createBuffer(1,AC.sampleRate*3,AC.sampleRate),d=bf.getChannelData(0);let l=0;for(let i=0;i<d.length;i++){const w=R()*2-1;if(b){l=(l+.02*w)/1.02;d[i]=l*3.5}else d[i]=w}return bf};BN=mk(1);WN=mk(0);

function S(f){if(!AC)return;try{f()}catch(e){}}
function out(n,pos){if(pos){const p=AC.createPanner();p.panningModel='HRTF';p.refDistance=3;p.rolloffFactor=1.4;p.positionX.value=pos[0];p.positionY.value=1.5;p.positionZ.value=pos[1];n.connect(p);p.connect(MG)}else n.connect(MG)}
function nz(dur,fc,q,g,pos,type,buf){const s=AC.createBufferSource();s.buffer=buf||BN;const f=AC.createBiquadFilter();f.type=type||'lowpass';f.frequency.value=fc;f.Q.value=q;const v=AC.createGain(),n=AC.currentTime;v.gain.setValueAtTime(0,n);v.gain.linearRampToValueAtTime(g,n+Math.min(.04,dur/3));v.gain.exponentialRampToValueAtTime(.001,n+dur);s.connect(f);f.connect(v);out(v,pos);s.start(n,R()*1.5);s.stop(n+dur+.1)}
function tn(f0,f1,dur,ty,g,pos,lp){const o=AC.createOscillator();o.type=ty;const n=AC.currentTime;o.frequency.setValueAtTime(f0,n);o.frequency.exponentialRampToValueAtTime(f1,n+dur);const f=AC.createBiquadFilter();f.frequency.value=lp||2000;const v=AC.createGain();v.gain.setValueAtTime(0,n);v.gain.linearRampToValueAtTime(g,n+.05);v.gain.exponentialRampToValueAtTime(.001,n+dur);o.connect(f);f.connect(v);out(v,pos);o.start(n);o.stop(n+dur+.1)}
function amb_ev(){const p=pick(14,70,px,pz),r=R();S(()=>{if(r<.3){for(let i=0;i<3;i++)setTimeout(()=>S(()=>{nz(.5,900,6,.4,p,'bandpass')}),i*(250+R()*300))}else if(r<.5)nz(3.2,260,1,.35,p);else if(r<.65)tn(380,900,2.2,'sawtooth',.07,p,900);else if(r<.85)tn(70,160,1.2,'sawtooth',.12,p,350);else{for(let i=0;i<4;i++)setTimeout(()=>S(()=>nz(.15,200,1,.3,p)),i*480)}});if(r>.85)lamps.forEach(l=>l.fl=1.2)}
// ---- loop
var last=0;function loop(ms){requestAnimationFrame(loop);const dt=Math.min((ms-last)/1000,.05);last=ms;t+=dt;
if(AC){const L=AC.listener;try{L.positionX.value=cam.position.x;L.positionY.value=cam.position.y;L.positionZ.value=cam.position.z;const v=new THREE.Vector3();cam.getWorldDirection(v);L.forwardX.value=v.x;L.forwardY.value=v.y;L.forwardZ.value=v.z;L.upX.value=0;L.upY.value=1;L.upZ.value=0}catch(e){}}
lamps.forEach(l=>{let e=1;const fz=state=='menu'?1.6:1;if(powered)e=1.2;else{const w=Math.sin(t*l.rate+l.ph)+Math.sin(t*7.3*l.rate);if(w>1.55||(l.fl>0))e=R()<.5?.1:.8;if(l.fl>0)l.fl-=dt}l.m.emissiveIntensity=e;if(l.l)l.l.intensity=(powered?1.3:.9)*e});
if(state=='menu'){px=4.5;pz=13.5;cam.position.set(px,1.65,pz);cam.rotation.set(Math.sin(t*.3)*.02,-PI/2+Math.sin(t*.2)*.1,0,'YXZ');mo.x=52;mo.z=13.5;mo.fa=-PI/2;mon.visible=Math.sin(t*.35)>.55&&Math.sin(t*9)>-.7;spot.intensity=0;anim(dt,0);ren.render(scene,cam);return}
spot.intensity=flashOn&&batt>0?2.4:0;
if(state=='intro'){introT+=dt;pitch=0;if(introT>4.5){hide();state='play'}}
if(state=='play'){game(dt)}
if(state=='dead'){deadT+=dt;const hx=mo.x,hz=mo.z;cam.lookAt(hx,2.5-Math.min(deadT,1)*.6,hz);cam.position.set(px+(R()-.5)*.1,1.5,pz+(R()-.5)*.1);spot.intensity=R()<.5?2:0;anim(dt,1);if(deadT>1.8&&$('ov').className.includes('h'))scr('<h1 style="color:#a22">GAME OVER</h1><p class="sub">It found you.</p><button onclick="restart()">RESTART</button><button onclick="menu();reset()">MENU</button>')}
if(state=='win'){anim(dt,0)}
ren.render(scene,cam)}
function restart(){reset();initAudio();state='intro';introT=3;hide();try{ren.domElement.requestPointerLock()}catch(e){}}
function win(){state='win';document.exitPointerLock();$('fade').style.transition='opacity 2s';$('fade').style.opacity=1;setTimeout(()=>{scr('<h1>YOU ESCAPED</h1><p class="sub">The doors close behind you. Something is still working.</p><button onclick="$(\'fade\').style.transition=\'none\';reset();play()">PLAY AGAIN</button><button onclick="menu();reset();$(\'fade\').style.opacity=0">MENU</button>');$('ov').style.background='#000d'},2200)}
function anim(dt,run){const m=window.mpart,w=t*(mo.state=='hunt'||run?12:3.2),a=mo.state=='hunt'||run?.9:.3;mon.position.set(mo.x,0,mo.z);mon.rotation.y=mo.fa;mon.rotation.x=0;m.lL.rotation.x=Math.sin(w)*a*(mo.path.length?1:.1);m.lR.rotation.x=-Math.sin(w)*a*(mo.path.length?1:.1);m.aL.rotation.x=-Math.sin(w)*a*.7+(mo.state=='hunt'?-.5:0);m.aR.rotation.x=Math.sin(w)*a*.7+(mo.state=='hunt'?-.5:0);m.hd.rotation.z=Math.sin(t*1.3)*.25+(mo.state=='hunt'?Math.sin(t*25)*.1:0);m.hd.rotation.x=mo.state=='hunt'?.4:.1;if(mo.state=='hunt'||run)mon.rotation.x=.25}
function game(dt){const sp=keys.ShiftLeft||keys.ShiftRight;let f=(keys.KeyW?1:0)-(keys.KeyS?1:0),s=(keys.KeyD?1:0)-(keys.KeyA?1:0);moving=false;
if(!hidden&&(f||s)){moving=true;const l=Math.hypot(f,s);f/=l;s/=l;const run=sp&&stam>0&&!window.tired,spd=run?5.6:3.1;if(run)stam-=24*dt;else if(sp&&stam<=0)window.tired=true;
const vx=(-Math.sin(yaw)*f+Math.cos(yaw)*s)*spd*dt,vz=(-Math.cos(yaw)*f-Math.sin(yaw)*s)*spd*dt;if(!blocked(px+vx,pz,.35))px+=vx;if(!blocked(px,pz+vz,.35))pz+=vz;bobT+=dt*(run?11:7.5);
stepT-=dt;if(stepT<0){stepT=run?.3:.5;S(()=>nz(.12,180,1,run?.08:.04,null))}if(!run&&!sp)keys._r=0;keys.ShiftLeft=keys.ShiftLeft;mo.run=run}
else mo.run=false;if(!(sp&&moving)&&stam<100){stam=Math.min(100,stam+14*dt);if(stam>30)window.tired=false}
if(!moving)moving=false;
if(flashOn&&batt>0)batt=Math.max(0,batt-dt/260);
cam.position.set(px,1.65+(hidden?-.15:Math.sin(bobT)*.04*(moving?1:0)),pz);cam.rotation.set(pitch,yaw,0,'YXZ');
const run=mo.run;moving=moving;ai(dt);
const dm=Math.hypot(mo.x-px,mo.z-pz);let fl2=flashOn&&batt>0;if(batt<.12&&R()<.1||dm<7&&R()<.12*(1-dm/8))spot.intensity=.2;
mon.visible=true;const tgt=mo.state=='hunt'?1:0;chase+=(tgt-chase)*Math.min(1,dt*(tgt?4:.5));$('vig').style.opacity=chase*.35;
if(AC&&window.DR){DR.gain.value=chase*.18+Math.max(0,(14-dm)/14)*.05;mo.st-=dt;if(mo.path.length&&mo.frozen<=0){const iv=mo.state=='hunt'?.27:.8;if(mo.st<0&&dm<45){mo.st=iv;S(()=>{nz(.2,mo.state=='hunt'?260:160,1,Math.min(.6,2.2/dm+.05),[mo.x,mo.z]);nz(.06,2500,2,.05,[mo.x,mo.z],'bandpass',WN)})}}
mo.br=(mo.br||0)-dt;if(mo.br<0&&dm<16){mo.br=mo.state=='hunt'?.7:2.4;S(()=>nz(.8,700,3,.12,[mo.x,mo.z],'bandpass',WN))}
if(chase>.5){hbT-=dt;if(hbT<0){hbT=.55;S(()=>{tn(70,40,.2,'sine',.35);setTimeout(()=>S(()=>tn(65,40,.2,'sine',.25)),160)})}}
aT-=dt;if(aT<0){aT=14+R()*20;amb_ev()}
if(powered){alT-=dt;if(alT<0){alT=1.2;S(()=>{tn(620,520,.5,'square',.04,null,900)})}}}
if(powered&&exitDoor.userData.open&&exitDoor.position.y<4.5)exitDoor.position.y+=dt*1.5;

let pr='';if(!hidden){for(const it of items)if(!it.got&&Math.hypot(it.x-px,it.z-pz)<2.4)pr=it.t=='F'?'E - take fuse':'E - take battery';for(const c of closets)if(Math.hypot(c.cx-px,c.cz-pz)<2.8)pr='E - hide'}else pr='E - leave closet';$('prompt').textContent=pr;
